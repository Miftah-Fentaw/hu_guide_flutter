name: hu_guide
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  icons_launcher: ^3.0.3
  url_launcher: ^6.3.2
  flutter_map: ^8.2.2
  webview_flutter: ^4.13.0
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  loading_indicator: ^3.1.1
  http: ^1.5.0

icons_launcher:
  image_path: "assets/huguide.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/colleges/
    - assets/clubs/
    - assets/events/



